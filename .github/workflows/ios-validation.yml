name: iOS validation

on:
  workflow_dispatch:
    inputs:
      focus:
        description: Test focus for the complete iOS module build
        required: true
        default: stabilization
        type: choice
        options:
          - stabilization
          - pdfium
          - lifecycle
          - all
          - build-only

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-26
    timeout-minutes: 90
    defaults:
      run:
        working-directory: example
    env:
      CI: '1'

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Select Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
          xcodebuild -version

      - name: Install consumer dependencies
        run: |
          npm pkg set 'dependencies.@grego5/react-native-inksign-pdf=file:..'
          npm install --no-package-lock --ignore-scripts --install-links --no-audit --no-fund

      - name: Ensure PDFium iOS binary is installed
        run: |
          for attempt in 1 2 3 4 5; do
            if node node_modules/@grego5/react-native-inksign-pdf/tools/fetch-pdfium-ios.mjs; then
              exit 0
            fi
            echo "PDFium download attempt $attempt failed; retrying..."
            sleep $((attempt * 10))
          done
          exit 1

      - name: Generate iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: Enable lifecycle test spec
        shell: bash
        run: |
          set -euo pipefail
          podfile="$GITHUB_WORKSPACE/example/ios/Podfile"
          test -f "$podfile"
          ruby - "$podfile" <<'RUBY'
          path = ARGV.fetch(0)
          text = File.read(path)
          declaration = "  pod 'ReactNativeInkSignPdf', :path => '../node_modules/@grego5/react-native-inksign-pdf', :testspecs => ['LifecycleTests']\n"
          abort 'LifecycleTests test spec is already configured unexpectedly' if text.include?(":testspecs => ['LifecycleTests']")
          updated = text.sub(/target [^\n]+ do\n/, "\\0#{declaration}")
          abort 'Could not find an application target in the generated Podfile' if updated == text
          File.write(path, updated)
          RUBY

      - name: Install CocoaPods
        run: pod install --project-directory=ios

      - name: Resolve lifecycle test scheme and focus
        shell: bash
        run: |
          set -euo pipefail
          workspace=""
          for candidate in "$GITHUB_WORKSPACE/example/ios"/*.xcworkspace; do
            if [ -d "$candidate" ]; then
              workspace="$candidate"
              break
            fi
          done
          if [ -z "$workspace" ]; then
            echo "No iOS workspace found under $GITHUB_WORKSPACE/example/ios" >&2
            ls -la "$GITHUB_WORKSPACE/example/ios" >&2
            exit 1
          fi
          test -n "$workspace"
          xcodebuild -list -json -workspace "$workspace" > "$RUNNER_TEMP/workspace-list.json"
          scheme="$(jq -r '[.workspace.schemes[] | select(test("LifecycleTests$"))][0] // empty' "$RUNNER_TEMP/workspace-list.json")"
          test -n "$scheme"
          simulator="$(xcrun simctl list devices available -j | jq -r '
            [.devices[] | .[] |
              select(.isAvailable == true) |
              {name, udid,
               priority: (if (.name | startswith("iPhone")) then 0 else 1 end)} |
              select(.udid != null)] |
            sort_by(.priority, .name, .udid) |
            .[0] // empty |
            "\(.name)|\(.udid)"')"
          test -n "$simulator"
          simulator_name="${simulator%%|*}"
          simulator_udid="${simulator##*|}"
          echo "Selected iOS Simulator: $simulator_name ($simulator_udid)"
          echo "IOS_WORKSPACE=$workspace" >> "$GITHUB_ENV"
          echo "IOS_SCHEME=$scheme" >> "$GITHUB_ENV"
          echo "IOS_DESTINATION=platform=iOS Simulator,id=$simulator_udid" >> "$GITHUB_ENV"

          case "${{ inputs.focus }}" in
            stabilization)
              test_classes="InkSignViewStabilizationTests"
              test_args="-only-testing:__LIFECYCLE_TARGET__/InkSignViewStabilizationTests"
              ;;
            pdfium)
              test_classes="PdfiumSmokeTests"
              test_args="-only-testing:__LIFECYCLE_TARGET__/PdfiumSmokeTests"
              ;;
            lifecycle)
              test_classes="InkSignViewLifecycleTests"
              test_args="-only-testing:__LIFECYCLE_TARGET__/InkSignViewLifecycleTests"
              ;;
            all)
              test_classes="InkSignViewStabilizationTests,PdfiumSmokeTests,InkSignViewLifecycleTests"
              test_args=""
              ;;
            build-only)
              test_classes=""
              test_args=""
              ;;
            *)
              echo "Unsupported focus: ${{ inputs.focus }}" >&2
              exit 1
              ;;
          esac
          echo "IOS_TEST_CLASSES=$test_classes" >> "$GITHUB_ENV"
          echo "IOS_TEST_ARGS_TEMPLATE=$test_args" >> "$GITHUB_ENV"

      - name: Build for testing
        working-directory: ${{ github.workspace }}
        run: |
          set -o pipefail
          xcodebuild \
            -workspace "$IOS_WORKSPACE" \
            -scheme "$IOS_SCHEME" \
            -destination "$IOS_DESTINATION" \
            -derivedDataPath "$RUNNER_TEMP/ios-derived-data" \
            -resultBundlePath "$RUNNER_TEMP/ios-build.xcresult" \
            build-for-testing 2>&1 | tee "$RUNNER_TEMP/ios-build.log"

      - name: Enumerate selected tests
        if: inputs.focus != 'build-only'
        working-directory: ${{ github.workspace }}
        run: |
          set -o pipefail
          xcodebuild \
            -enumerate-tests \
            -test-enumeration-format json \
            -workspace "$IOS_WORKSPACE" \
            -scheme "$IOS_SCHEME" \
            -destination "$IOS_DESTINATION" \
            -derivedDataPath "$RUNNER_TEMP/ios-derived-data" \
            > "$RUNNER_TEMP/ios-tests.json"
          for test_class in ${IOS_TEST_CLASSES//,/ }; do
            jq -e --arg class "$test_class" \
              '[.. | objects | (.identifier?, .name?, .className?) |
                select(type == "string" and contains($class))] | length > 0' \
              "$RUNNER_TEMP/ios-tests.json" > /dev/null
          done
          first_class="${IOS_TEST_CLASSES%%,*}"
          lifecycle_target="$(jq -r --arg class "$first_class" \
            '[.. | strings | select(contains($class)) | split("/") |
              select(length >= 2) | .[0]] | .[0] // empty' \
            "$RUNNER_TEMP/ios-tests.json")"
          test -n "$lifecycle_target"
          test_args="${IOS_TEST_ARGS_TEMPLATE/__LIFECYCLE_TARGET__/$lifecycle_target}"
          echo "IOS_TEST_ARGS=$test_args" >> "$GITHUB_ENV"

      - name: Run selected tests
        if: inputs.focus != 'build-only'
        working-directory: ${{ github.workspace }}
        run: |
          set -o pipefail
          test_args=()
          if [ -n "$IOS_TEST_ARGS" ]; then
            read -r -a test_args <<< "$IOS_TEST_ARGS"
          fi
          xcodebuild \
            -workspace "$IOS_WORKSPACE" \
            -scheme "$IOS_SCHEME" \
            -destination "$IOS_DESTINATION" \
            -derivedDataPath "$RUNNER_TEMP/ios-derived-data" \
            -resultBundlePath "$RUNNER_TEMP/ios-tests.xcresult" \
            test-without-building "${test_args[@]}" 2>&1 | tee "$RUNNER_TEMP/ios-tests.log"

      - name: Verify executed test count
        if: inputs.focus != 'build-only'
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          xcrun xcresulttool get test-results summary \
            --path "$RUNNER_TEMP/ios-tests.xcresult" \
            --format json > "$RUNNER_TEMP/ios-test-summary.json"
          executed="$(jq '[.. | objects | .testsCount? // empty | numbers] |
            max // 0' "$RUNNER_TEMP/ios-test-summary.json")"
          test "$executed" -gt 0

      - name: Upload Xcode diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-validation-diagnostics
          path: |
            ${{ runner.temp }}/ios-*.xcresult
            ${{ runner.temp }}/ios-*.log
            ${{ runner.temp }}/ios-tests.json
            ${{ runner.temp }}/ios-test-summary.json
          if-no-files-found: ignore
