name: Build and publish InkEngine

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable GitHub release tag for the ink-engine artifacts
        required: true
        default: ink-engine-1.0.0
      reuse_run_id:
        description: Existing successful InkEngine run ID whose ABI artifacts should be republished (leave empty to build)
        required: false
        default: ''
        type: string

permissions:
  contents: read

env:
  INK_ENGINE_NDK: 27.1.12297006
  INK_ENGINE_API_VERSION: 8
  INK_ENGINE_RELEASE_TAG: ${{ inputs.release_tag }}

jobs:
  resolve-source:
    name: Resolve artifact source
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      run_id: ${{ steps.source.outputs.run_id }}
      source_revision: ${{ steps.source.outputs.source_revision }}
    steps:
      - name: Resolve the current or existing successful run
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_RUN_ID: ${{ inputs.reuse_run_id }}
        run: |
          set -euo pipefail
          if [[ -z "$REUSE_RUN_ID" ]]; then
            run_id="$GITHUB_RUN_ID"
            source_revision="$GITHUB_SHA"
          else
            [[ "$REUSE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || {
              echo "reuse_run_id must be a positive numeric workflow run ID" >&2
              exit 1
            }
            run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REUSE_RUN_ID")"
            jq -e '
              .status == "completed" and .conclusion == "success" and
              .event == "workflow_dispatch" and
              .path == ".github/workflows/build-and-publish-ink-engine.yml"
            ' <<< "$run_json" >/dev/null || {
              echo "reuse_run_id must identify a successful InkEngine workflow run in this repository" >&2
              exit 1
            }
            run_id="$REUSE_RUN_ID"
            source_revision="$(jq -r '.head_sha' <<< "$run_json")"
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "source_revision=$source_revision" >> "$GITHUB_OUTPUT"

  native-tests:
    name: Source-linked native tests
    needs: resolve-source
    if: ${{ inputs.reuse_run_id == '' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the full source repository
        uses: actions/checkout@v7

      - name: Configure the source-linked native build
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S . -B build/startup-release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_PERFETTO_TRACE=OFF

      - name: Run source-linked native tests
        shell: bash
        run: |
          set -euxo pipefail
          pwsh -NoProfile -File tools/test-native.ps1 -Suite all -Build

  build-archive:
    name: Build Android ${{ matrix.abi }} archive
    needs: native-tests
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
          - abi: x86_64

    steps:
      - name: Check out the full source repository
        uses: actions/checkout@v7

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install the pinned NDK and CMake
        shell: bash
        run: |
          set -euxo pipefail
          sdkmanager "cmake;3.22.1" "ndk;${INK_ENGINE_NDK}"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/$INK_ENGINE_NDK" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/ndk/$INK_ENGINE_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/cmake/3.22.1/bin" >> "$GITHUB_PATH"
          test -x "$ANDROID_SDK_ROOT/ndk/$INK_ENGINE_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++"
          grep -Fq "Pkg.Revision = $INK_ENGINE_NDK" \
            "$ANDROID_SDK_ROOT/ndk/$INK_ENGINE_NDK/source.properties"

      - name: Build and smoke-link the optimized archive
        shell: bash
        run: |
          set -euxo pipefail
          pwsh -NoProfile -File tools/build-ink-engine-archive.ps1 \
            -Abi "${{ matrix.abi }}" \
            -NdkPath "$ANDROID_NDK_ROOT" \
            -BuildDirectory "$RUNNER_TEMP/ink-engine/${{ matrix.abi }}" \
            -OutputDirectory "$RUNNER_TEMP/ink-engine/${{ matrix.abi }}/artifacts" \
            -SmokeLink

      - name: Validate the archive and release metadata
        shell: bash
        run: |
          set -euxo pipefail
          archive="$RUNNER_TEMP/ink-engine/${{ matrix.abi }}/artifacts/libinkengine_${{ matrix.abi }}.a"
          metadata="$archive.json"
          pwsh -NoProfile -File tools/verify-ink-engine-archive.ps1 \
            -Archive "$archive" \
            -Metadata "$metadata" \
            -Abi "${{ matrix.abi }}" \
            -LlvmBin "$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin" \
            -ExpectedSourceRevision "$GITHUB_SHA" \
            -ExpectedNdkVersion "$INK_ENGINE_NDK"

      - name: Stage the versioned artifact layout
        shell: bash
        run: |
          set -euxo pipefail
          staging="$RUNNER_TEMP/ink-engine/staging"
          mkdir -p "$staging/android/${{ matrix.abi }}"
          cp "$RUNNER_TEMP/ink-engine/${{ matrix.abi }}/artifacts/libinkengine_${{ matrix.abi }}.a" \
            "$staging/android/${{ matrix.abi }}/"
          cp "$RUNNER_TEMP/ink-engine/${{ matrix.abi }}/artifacts/libinkengine_${{ matrix.abi }}.a.json" \
            "$staging/android/${{ matrix.abi }}/"
          cp THIRD_PARTY_NOTICES.md "$staging/"
          cp CREDITS.md "$staging/"

      - name: Upload the verified ABI artifact
        uses: actions/upload-artifact@v7
        with:
          name: ink-engine-static-${{ matrix.abi }}
          path: ${{ runner.temp }}/ink-engine/staging
          if-no-files-found: error

  publish-release:
    name: Publish InkEngine release
    needs: [resolve-source, build-archive]
    if: ${{ !cancelled() && needs.resolve-source.result == 'success' && (needs.build-archive.result == 'success' || inputs.reuse_run_id != '') }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    env:
      INK_ENGINE_SOURCE_REVISION: ${{ needs.resolve-source.outputs.source_revision }}
    steps:
      - name: Check out the full source repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-source.outputs.source_revision }}

      - name: Download all verified ABI artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: ink-engine-static-*
          path: release-input
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ needs.resolve-source.outputs.run_id }}

      - name: Assemble the immutable release bundle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          case "$INK_ENGINE_RELEASE_TAG" in
            ink-engine-[A-Za-z0-9._-]*) ;;
            *) echo "release_tag must start with ink-engine- and contain no slashes" >&2; exit 1 ;;
          esac
          if gh release view "$INK_ENGINE_RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $INK_ENGINE_RELEASE_TAG already exists; releases are immutable" >&2
            exit 1
          fi

          expected_abis=(arm64-v8a x86_64)
          mkdir -p release-assets
          test -f release-input/THIRD_PARTY_NOTICES.md
          test -f release-input/CREDITS.md
          for abi in "${expected_abis[@]}"; do
            archive="release-input/android/$abi/libinkengine_${abi}.a"
            metadata="$archive.json"
            test -f "$archive"
            test -f "$metadata"
            jq -e \
              --arg abi "$abi" \
              --arg archive "libinkengine_${abi}.a" \
              --arg source "$INK_ENGINE_SOURCE_REVISION" \
              --arg ndk "$INK_ENGINE_NDK" \
              --argjson api "$INK_ENGINE_API_VERSION" \
              --argjson size "$(stat -c %s "$archive")" \
              --arg sha "$(sha256sum "$archive" | cut -d ' ' -f 1)" \
              '.format == 1 and .abi == $abi and .archive == $archive and
               .sourceRevision == $source and .ndkVersion == $ndk and
               .apiVersion == $api and .perfettoTrace == false and
               .sizeBytes == $size and .sha256 == $sha' "$metadata" >/dev/null
            cp "$archive" "release-assets/libinkengine_${abi}.a"
            cp "$metadata" "release-assets/libinkengine_${abi}.a.json"
          done

          cp -R release-input/android release-assets/android
          cp release-input/THIRD_PARTY_NOTICES.md release-assets/
          cp release-input/CREDITS.md release-assets/
          copy_dependency_license() {
            local license
            license="$(git ls-files -- "*/$1/LICENSE")"
            test -f "$license"
            cp "$license" "release-assets/$2"
          }
          copy_dependency_license google-ink GOOGLE_INK_LICENSE
          copy_dependency_license abseil-cpp ABSEIL_LICENSE

          metadata_files=(release-input/android/*/*.json)
          test "${#metadata_files[@]}" -eq "${#expected_abis[@]}"
          artifact_json="$(jq -cs 'map(del(.archive))' "${metadata_files[@]}")"
          jq -n \
            --arg tag "$INK_ENGINE_RELEASE_TAG" \
            --arg source "$INK_ENGINE_SOURCE_REVISION" \
            --arg ndk "$INK_ENGINE_NDK" \
            --argjson api "$INK_ENGINE_API_VERSION" \
            --argjson artifacts "$artifact_json" \
            '{format: 1, releaseTag: $tag, sourceRevision: $source,
              ndkVersion: $ndk, apiVersion: $api, perfettoTrace: false,
              artifacts: $artifacts}' > release-assets/manifest.json

          bundle="${INK_ENGINE_RELEASE_TAG}-android-static.zip"
          (cd release-assets && zip -qr "../$bundle" android \
            THIRD_PARTY_NOTICES.md CREDITS.md GOOGLE_INK_LICENSE ABSEIL_LICENSE \
            manifest.json)
          mv "$bundle" release-assets/
          (cd release-assets && sha256sum \
            *.a *.json "${bundle}" > SHA256SUMS)

      - name: Publish the immutable GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          tag_ref="$(git ls-remote --tags origin "refs/tags/$INK_ENGINE_RELEASE_TAG")"
          release_target=(--target "$INK_ENGINE_SOURCE_REVISION")
          if [[ -n "$tag_ref" ]]; then
            git fetch --no-tags origin "refs/tags/$INK_ENGINE_RELEASE_TAG"
            tag_revision="$(git rev-parse 'FETCH_HEAD^{commit}')"
            if [[ "$tag_revision" != "$INK_ENGINE_SOURCE_REVISION" ]]; then
              echo "Release tag $INK_ENGINE_RELEASE_TAG does not match artifact source $INK_ENGINE_SOURCE_REVISION" >&2
              exit 1
            fi
            # An explicit historical target can require workflows:write even
            # when the existing tag already points to that commit.
            release_target=(--verify-tag)
          fi
          gh release create "$INK_ENGINE_RELEASE_TAG" \
            release-assets/*.a release-assets/*.json release-assets/*.zip \
            release-assets/SHA256SUMS release-assets/*.md release-assets/*_LICENSE \
            "${release_target[@]}" \
            --title "InkEngine $INK_ENGINE_RELEASE_TAG" \
            --notes "Verified Android ink-engine archives. Source: $INK_ENGINE_SOURCE_REVISION; NDK: $INK_ENGINE_NDK; tracing/debug instrumentation is compiled out of normal artifacts."
