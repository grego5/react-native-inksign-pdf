name: Build iOS Ad Hoc dev client

on:
  workflow_dispatch:
    inputs:
      reuse_run_id:
        description: 'Existing successful dev-client run ID whose IPA artifact should be republished (leave empty to build)'
        required: false
        type: string

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: example
    env:
      EXPO_PUBLIC_APP_NAME: Inksign PDF Dev Client
      EXPO_PUBLIC_PACKAGE_NAME: dev.grego5.inksignpdf
      EXPO_PUBLIC_SLUG: inksign-pdf-test
      EXPO_PUBLIC_URL_SCHEME: inksign-pdf
      IOS_DISTRIBUTION_P12_B64: ${{ secrets.IOS_DISTRIBUTION_P12_B64 }}
      IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
      IOS_AD_HOC_PROFILE_B64: ${{ secrets.IOS_AD_HOC_PROFILE_B64 }}

    steps:
      - name: Check out library source
        if: inputs.reuse_run_id == ''
        uses: actions/checkout@v5

      - name: Select Node.js
        if: inputs.reuse_run_id == ''
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Select Xcode
        if: inputs.reuse_run_id == ''
        run: |
          sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
          xcodebuild -version

      - name: Install consumer dependencies
        if: inputs.reuse_run_id == ''
        run: npm install --no-package-lock --ignore-scripts --install-links --no-audit --no-fund

      - name: Ensure PDFium iOS binary is installed
        if: inputs.reuse_run_id == ''
        run: |
          for attempt in 1 2 3 4 5; do
            if node node_modules/@grego5/react-native-inksign-pdf/tools/fetch-pdfium-ios.mjs; then
              exit 0
            fi
            echo "PDFium download attempt $attempt failed; retrying..."
            sleep $((attempt * 10))
          done
          exit 1

      - name: Generate iOS project
        if: inputs.reuse_run_id == ''
        env:
          CI: '1'
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        if: inputs.reuse_run_id == ''
        run: pod install --project-directory=ios

      - name: Install Apple signing credentials
        if: inputs.reuse_run_id == ''
        shell: bash
        run: |
          set -euo pipefail
          signing_dir="$RUNNER_TEMP/ios-signing"
          mkdir -p "$signing_dir"
          printf '%s' "$IOS_DISTRIBUTION_P12_B64" | base64 -D > "$signing_dir/distribution.p12"
          printf '%s' "$IOS_AD_HOC_PROFILE_B64" | base64 -D > "$signing_dir/profile.mobileprovision"
          security cms -D -i "$signing_dir/profile.mobileprovision" > "$signing_dir/profile.plist"

          profile_uuid=$(/usr/libexec/PlistBuddy -c 'Print:UUID' "$signing_dir/profile.plist")
          profile_name=$(/usr/libexec/PlistBuddy -c 'Print:Name' "$signing_dir/profile.plist")
          team_id=$(/usr/libexec/PlistBuddy -c 'Print:TeamIdentifier:0' "$signing_dir/profile.plist")
          application_identifier=$(/usr/libexec/PlistBuddy -c 'Print:Entitlements:application-identifier' "$signing_dir/profile.plist")
          test "$application_identifier" = "$team_id.dev.grego5.inksignpdf"

          keychain="$signing_dir/build.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$signing_dir/distribution.p12" \
            -k "$keychain" \
            -P "$IOS_DISTRIBUTION_P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -s "$keychain"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$signing_dir/profile.mobileprovision" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"

          {
            echo "IOS_KEYCHAIN=$keychain"
            echo "IOS_TEAM_ID=$team_id"
            echo "IOS_PROFILE_NAME=$profile_name"
          } >> "$GITHUB_ENV"

      - name: Archive iOS app
        if: inputs.reuse_run_id == ''
        run: |
          set -o pipefail
          workspace="$(find ios -maxdepth 1 -type d -name '*.xcworkspace' -print -quit)"
          test -n "$workspace"
          scheme="$(basename "$workspace" .xcworkspace)"
          test -n "$scheme"
          xcodebuild -list -workspace "$workspace"
          {
            echo "IOS_WORKSPACE=$workspace"
            echo "IOS_SCHEME=$scheme"
          } >> "$GITHUB_ENV"
          xcodebuild \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -configuration Debug \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/$scheme.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_NAME" \
            archive 2>&1 | tee "$RUNNER_TEMP/inksign-ios-archive.log"

      - name: Export ad hoc IPA
        if: inputs.reuse_run_id == ''
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>$IOS_TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>dev.grego5.inksignpdf</key>
              <string>$IOS_PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          PLIST
          mkdir -p "$RUNNER_TEMP/ios-export"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/$IOS_SCHEME.xcarchive" \
            -exportPath "$RUNNER_TEMP/ios-export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"


      - name: Download existing IPA artifact
        if: inputs.reuse_run_id != ''
        uses: actions/download-artifact@v7
        with:
          name: inksign-pdf-test-ios-devclient
          path: ${{ runner.temp }}/ios-export
          github-token: ${{ github.token }}
          run-id: ${{ inputs.reuse_run_id }}

      - name: Prepare IPA for publishing
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          ipa_path="$(find "$RUNNER_TEMP/ios-export" -maxdepth 1 -name '*.ipa' -type f -print -quit)"
          test -n "$ipa_path"
          echo "IOS_IPA_PATH=$ipa_path" >> "$GITHUB_ENV"
          echo "IOS_IPA_NAME=$(basename "$ipa_path")" >> "$GITHUB_ENV"
          echo "IOS_RELEASE_TAG=ios-devclient-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"

      - name: Upload installable IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: inksign-pdf-test-ios-devclient
          path: ${{ runner.temp }}/ios-export/*.ipa
          if-no-files-found: error

      - name: Publish IPA GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          gh release create "$IOS_RELEASE_TAG" \
            "$IOS_IPA_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --title "iOS Ad Hoc dev client workflow run ${GITHUB_RUN_NUMBER}" \
            --notes "Installable iOS Ad Hoc dev client from workflow run ${GITHUB_RUN_ID}."

      - name: Create OTA manifest
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          site_base_url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          ipa_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${IOS_RELEASE_TAG}/${IOS_IPA_NAME// /%20}"
          ipa_metadata="$RUNNER_TEMP/ios-ipa-metadata"
          rm -rf "$ipa_metadata"
          mkdir -p "$ipa_metadata"
          unzip -q "$IOS_IPA_PATH" 'Payload/*.app/Info.plist' -d "$ipa_metadata"
          app_info_plist="$(find "$ipa_metadata/Payload" -name Info.plist -type f -print -quit)"
          test -n "$app_info_plist"
          bundle_identifier=$(/usr/libexec/PlistBuddy -c 'Print:CFBundleIdentifier' "$app_info_plist")
          bundle_version=$(/usr/libexec/PlistBuddy -c 'Print:CFBundleVersion' "$app_info_plist")

          mkdir -p "$RUNNER_TEMP/ios-ota"
          cat > "$RUNNER_TEMP/ios-ota/manifest.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>items</key>
            <array>
              <dict>
                <key>assets</key>
                <array>
                  <dict>
                    <key>kind</key>
                    <string>software-package</string>
                    <key>url</key>
                    <string>$ipa_url</string>
                  </dict>
                </array>
                <key>metadata</key>
                <dict>
                  <key>bundle-identifier</key>
                  <string>$bundle_identifier</string>
                  <key>bundle-version</key>
                  <string>$bundle_version</string>
                  <key>kind</key>
                  <string>software</string>
                  <key>title</key>
                  <string>Inksign PDF Dev Client</string>
                </dict>
              </dict>
            </array>
          </dict>
          </plist>
          PLIST

          manifest_url="$site_base_url/manifest.plist"
          install_url="itms-services://?action=download-manifest&url=$manifest_url"
          if ! command -v qrencode >/dev/null 2>&1; then
            brew install qrencode
          fi
          qrencode -o "$RUNNER_TEMP/ios-ota/install-qr.png" "$install_url"
          cat > "$RUNNER_TEMP/ios-ota/index.html" <<HTML
          <!doctype html>
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Inksign PDF Dev Client</title>
          <h1>Inksign PDF Dev Client</h1>
          <p>Scan this QR code with the iPhone camera:</p>
          <p><img src="./install-qr.png" alt="Install QR code" width="320" height="320"></p>
          <p><a href="$install_url">Install Inksign PDF Dev Client on this iPhone</a></p>
          <p>Workflow run ${GITHUB_RUN_NUMBER}; the device UDID must be included in the provisioning profile.</p>
          HTML
          echo "IOS_OTA_INSTALL_URL=$install_url" >> "$GITHUB_ENV"
          echo "IOS_OTA_SITE_URL=$site_base_url" >> "$GITHUB_ENV"

      - name: Upload OTA site
        # v4 bundles upload-artifact@v4 (Node 20); this revision contains the
        # Node 24 artifact action until upload-pages-artifact publishes v5.
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: ${{ runner.temp }}/ios-ota

      - name: Deploy OTA site
        id: pages-deployment
        uses: actions/deploy-pages@v5

      - name: Publish OTA install link
        working-directory: ${{ github.workspace }}
        run: |
          {
            echo "## iOS Ad Hoc dev client install"
            echo
            echo "Open this page on another screen and scan the QR code with the registered iPhone:"
            echo
            echo "$IOS_OTA_SITE_URL/"
            echo
            echo "![Install QR code]($IOS_OTA_SITE_URL/install-qr.png)"
            echo
            echo "The IPA is also available from the GitHub Release:"
            echo "https://github.com/$GITHUB_REPOSITORY/releases/tag/$IOS_RELEASE_TAG"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload archive log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: inksign-ios-archive-log
          path: ${{ runner.temp }}/inksign-ios-archive.log
          if-no-files-found: ignore
