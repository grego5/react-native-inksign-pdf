import groovy.json.JsonSlurper
import java.net.HttpURLConnection
import java.security.MessageDigest
import java.nio.charset.StandardCharsets

apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

apply from: '../nitrogen/generated/android/ReactNativeInkSignPdf+autolinking.gradle'

def pdfiumRoot = file('../core/third_party/pdfium')
def pdfiumAndroidRoot = file("${buildDir}/pdfium")
def pdfiumManifest = new JsonSlurper().parse(new File(pdfiumRoot, 'manifest.json'))
def requiredPdfiumSymbols = pdfiumManifest.upstream.requiredSymbols.collect {
  it.toString()
}
def requiredPdfiumAndroidNdk = pdfiumManifest.buildWorkflow.androidNdk.toString()
def pdfiumRelease = pdfiumManifest.distribution.staticRelease
def pdfiumAndroidArtifacts = pdfiumRelease.artifacts.findAll { artifact ->
  artifact.target == 'android' && artifact.buildType == 'static'
}.collectEntries { artifact -> [(artifact.abi.toString()): artifact] }
def pdfiumAndroidArchives = [
  new File(pdfiumAndroidRoot, 'arm64-v8a/libpdfium.a'),
  new File(pdfiumAndroidRoot, 'x86_64/libpdfium.a')
]
def inkEngineReleaseFile = file('ink-engine-release.json')
def inkEngineRelease = new JsonSlurper().parse(inkEngineReleaseFile)
def inkEngineAndroidRoot = file("${buildDir}/ink-engine")
def inkEngineAndroidArchives = inkEngineRelease.abis.collect { abi ->
  def artifact = inkEngineRelease.artifacts[abi.toString()]
  new File(inkEngineAndroidRoot, "${abi}/${artifact.archive}")
}
def inkEngineAndroidMetadata = inkEngineRelease.abis.collect { abi ->
  def artifact = inkEngineRelease.artifacts[abi.toString()]
  new File(inkEngineAndroidRoot, "${abi}/${artifact.metadata}")
}
def inkEngineUseSource = rootProject.findProperty(
  'ReactNativeInkSignPdf_useSourceInkEngine'
)?.toString()?.toBoolean() ?: false

def sha256File = { File input ->
  def digest = MessageDigest.getInstance('SHA-256')
  input.withInputStream { stream ->
    byte[] buffer = new byte[1024 * 1024]
    int read
    while ((read = stream.read(buffer)) != -1) {
      digest.update(buffer, 0, read)
    }
  }
  digest.digest().collect { byteValue -> String.format('%02x', byteValue & 0xff) }.join()
}

def assertArchive = { File archive, def artifact ->
  if (!archive.isFile()) {
    return false
  }

  if (archive.length() != artifact.packagedLibraryBytes as long ||
      sha256File(archive) != artifact.packagedLibrarySha256.toString().toLowerCase()) {
    return false
  }

  byte[] bytes = archive.bytes
  if (bytes.length < 8 || new String(bytes, 0, 8, StandardCharsets.US_ASCII) != '!<arch>\n') {
    return false
  }

  String symbols = new String(bytes, StandardCharsets.ISO_8859_1)
  for (String symbol : requiredPdfiumSymbols) {
    if (!symbols.contains(symbol)) {
      return false
    }
  }

  boolean hasElfObject = false
  boolean hasExpectedMachine = false
  int memberOffset = 8
  while (memberOffset <= bytes.length - 60) {
    String memberSizeText = new String(bytes, memberOffset + 48, 10, StandardCharsets.US_ASCII).trim()
    long memberSize
    try {
      memberSize = Long.parseLong(memberSizeText)
    } catch (NumberFormatException ignored) {
      return false
    }

    int memberDataOffset = memberOffset + 60
    if (memberDataOffset + 20 <= bytes.length &&
        (bytes[memberDataOffset] & 0xff) == 0x7f &&
        (bytes[memberDataOffset + 1] & 0xff) == 0x45 &&
        (bytes[memberDataOffset + 2] & 0xff) == 0x4c &&
        (bytes[memberDataOffset + 3] & 0xff) == 0x46) {
      hasElfObject = true
      int machine = ((bytes[memberDataOffset + 19] & 0xff) << 8) |
          (bytes[memberDataOffset + 18] & 0xff)
      if ((artifact.expectedElfMachine == 'AARCH64' && machine == 0x00b7) ||
          (artifact.expectedElfMachine == 'X86_64' && machine == 0x003e)) {
        hasExpectedMachine = true
      }
    }

    memberOffset = memberDataOffset + memberSize
    if ((memberOffset & 1) != 0) {
      memberOffset++
    }
  }

  return hasElfObject && hasExpectedMachine
}

def downloadReleaseAsset = { String url, File target ->
  target.parentFile.mkdirs()
  HttpURLConnection connection = (HttpURLConnection) new URL(url).openConnection()
  connection.setConnectTimeout(30_000)
  connection.setReadTimeout(120_000)
  connection.setInstanceFollowRedirects(true)
  connection.setRequestProperty('User-Agent', 'react-native-inksign-pdf-release-fetcher')
  try {
    if (connection.responseCode != HttpURLConnection.HTTP_OK) {
      throw new GradleException("Release asset download failed (${connection.responseCode}): ${url}")
    }
    connection.inputStream.withCloseable { input ->
      target.withOutputStream { output ->
        byte[] buffer = new byte[1024 * 1024]
        int read
        while ((read = input.read(buffer)) != -1) {
          output.write(buffer, 0, read)
        }
      }
    }
  } finally {
    connection.disconnect()
  }
}

def checksumFor = { File checksums, String assetName ->
  def line = checksums.getText('UTF-8').readLines().find { candidate ->
    def trimmed = candidate.trim()
    trimmed.endsWith("  ${assetName}") || trimmed.endsWith(" *${assetName}")
  }
  line ? line.trim().split(/\s+/)[0].toLowerCase() : null
}

def assertInkEngineReleaseManifest = { File manifestFile ->
  if (!manifestFile.isFile() || manifestFile.length() != inkEngineRelease.releaseManifestBytes as long ||
      sha256File(manifestFile) != inkEngineRelease.releaseManifestSha256.toString().toLowerCase()) {
    throw new GradleException('InkEngine release manifest does not match the pinned release')
  }

  def manifest = new JsonSlurper().parse(manifestFile)
  if (manifest.format != inkEngineRelease.format ||
      manifest.releaseTag != inkEngineRelease.releaseTag ||
      manifest.sourceRevision != inkEngineRelease.sourceRevision ||
      manifest.ndkVersion != inkEngineRelease.ndkVersion ||
      manifest.apiVersion != inkEngineRelease.apiVersion ||
      manifest.perfettoTrace != inkEngineRelease.perfettoTrace ||
      manifest.artifacts*.abi != inkEngineRelease.abis) {
    throw new GradleException("InkEngine release manifest identity does not match ${inkEngineRelease.releaseTag}")
  }

  inkEngineRelease.abis.each { abi ->
    def expected = inkEngineRelease.artifacts[abi.toString()]
    def artifact = manifest.artifacts.find { it.abi == abi }
    if (artifact == null || artifact.apiVersion != inkEngineRelease.apiVersion ||
        artifact.sourceRevision != inkEngineRelease.sourceRevision ||
        artifact.ndkVersion != inkEngineRelease.ndkVersion ||
        artifact.perfettoTrace != inkEngineRelease.perfettoTrace ||
        artifact.sizeBytes != expected.sizeBytes || artifact.sha256 != expected.sha256) {
      throw new GradleException("InkEngine release manifest has invalid ${abi} metadata")
    }
  }
}

def assertInkEngineMetadata = { File metadataFile, String abi ->
  def expected = inkEngineRelease.artifacts[abi]
  if (!metadataFile.isFile()) {
    throw new GradleException("InkEngine metadata is missing for ${abi}: ${metadataFile}")
  }
  def metadata = new JsonSlurper().parse(metadataFile)
  if (metadata.format != inkEngineRelease.format || metadata.archive != expected.archive ||
      metadata.abi != abi || metadata.apiVersion != inkEngineRelease.apiVersion ||
      metadata.sourceRevision != inkEngineRelease.sourceRevision ||
      metadata.ndkVersion != inkEngineRelease.ndkVersion ||
      metadata.perfettoTrace != inkEngineRelease.perfettoTrace ||
      metadata.sizeBytes != expected.sizeBytes || metadata.sha256 != expected.sha256) {
    throw new GradleException("InkEngine metadata does not match the pinned release for ${abi}")
  }
}

def assertInkEngineArchive = { File archive, String abi ->
  def expected = inkEngineRelease.artifacts[abi]
  if (!archive.isFile() || archive.length() != expected.sizeBytes as long ||
      sha256File(archive) != expected.sha256.toString().toLowerCase()) {
    throw new GradleException("InkEngine archive does not match the pinned release for ${abi}: ${archive}")
  }
  byte[] bytes = archive.bytes
  if (bytes.length < 8 || new String(bytes, 0, 8, StandardCharsets.US_ASCII) != '!<arch>\n') {
    throw new GradleException("InkEngine archive is invalid for ${abi}: ${archive}")
  }
}

def assertInkEngineInstallation = { File root, File archiveRoot = root ->
  def manifestFile = new File(root, 'manifest.json')
  def checksumsFile = new File(root, inkEngineRelease.checksumsAsset.toString())
  if (!checksumsFile.isFile() || checksumsFile.length() != inkEngineRelease.checksumsAssetBytes as long ||
      sha256File(checksumsFile) != inkEngineRelease.checksumsAssetSha256.toString().toLowerCase()) {
    throw new GradleException('InkEngine checksum list does not match the pinned release')
  }
  assertInkEngineReleaseManifest(manifestFile)
  inkEngineRelease.abis.each { abi ->
    def expected = inkEngineRelease.artifacts[abi.toString()]
    def archive = new File(archiveRoot, "${abi}/${expected.archive}")
    def metadata = new File(archiveRoot, "${abi}/${expected.metadata}")
    assertInkEngineArchive(archive, abi.toString())
    assertInkEngineMetadata(metadata, abi.toString())
    if (checksumFor(checksumsFile, expected.archive) != expected.sha256.toString().toLowerCase() ||
        checksumFor(checksumsFile, expected.metadata) != sha256File(metadata)) {
      throw new GradleException("InkEngine checksum list is incomplete for ${abi}")
    }
  }
}

def isValidInkEngineInstallation = {
  try {
    assertInkEngineInstallation(inkEngineAndroidRoot)
    true
  } catch (Exception ignored) {
    false
  }
}

def preparePdfium = tasks.register('preparePdfium') {
  inputs.file(new File(pdfiumRoot, 'manifest.json'))
  outputs.files(pdfiumAndroidArchives)
  outputs.upToDateWhen {
    pdfiumAndroidArchives.every { archive ->
      def abi = archive.parentFile.name
      def artifact = pdfiumAndroidArtifacts[abi]
      artifact != null && assertArchive(archive, artifact)
    }
  }

  doLast {
    if (pdfiumAndroidArchives.every { archive ->
      def artifact = pdfiumAndroidArtifacts[archive.parentFile.name]
      artifact != null && assertArchive(archive, artifact)
    }) {
      logger.lifecycle('PDFium: using cached libpdfium.a')
      return
    }

    if (!pdfiumRelease?.tag || !pdfiumRelease?.androidAsset ||
        !pdfiumRelease?.androidAssetSha256 || !pdfiumRelease?.checksumsAsset ||
        !pdfiumRelease?.checksumsAssetSha256) {
      throw new GradleException('PDFium release metadata is incomplete')
    }

    def releaseBase = "${pdfiumRelease.repository}/releases/download/${pdfiumRelease.tag}"
    def assetName = pdfiumRelease.androidAsset.toString()
    def checksumName = pdfiumRelease.checksumsAsset.toString()
    def downloadDir = file("${buildDir}/pdfium-download")
    delete(downloadDir)
    downloadDir.mkdirs()

    def archive = new File(downloadDir, assetName)
    def checksums = new File(downloadDir, checksumName)
    logger.lifecycle("PDFium: downloading ${assetName} and ${checksumName}")
    downloadReleaseAsset("${releaseBase}/${assetName}", archive)
    downloadReleaseAsset("${releaseBase}/${checksumName}", checksums)

    logger.lifecycle("PDFium: verifying ${assetName}")
    def checksumsSha256 = sha256File(checksums)
    if (checksumsSha256 != pdfiumRelease.checksumsAssetSha256.toString().toLowerCase()) {
      throw new GradleException("PDFium checksum-list mismatch: expected ${pdfiumRelease.checksumsAssetSha256}, got ${checksumsSha256}")
    }

    def expectedSha256 = pdfiumRelease.androidAssetSha256.toString().toLowerCase()
    def actualSha256 = sha256File(archive)
    if (expectedSha256 != actualSha256) {
      throw new GradleException("PDFium archive checksum mismatch for ${assetName}: expected ${expectedSha256}, got ${actualSha256}")
    }

    def checksumLine = checksums.getText('UTF-8').readLines().find { line ->
      line.trim().endsWith("  ${assetName}") || line.trim().endsWith(" *${assetName}")
    }
    if (!checksumLine) {
      throw new GradleException("PDFium checksum entry not found for ${assetName}")
    }
    def listedSha256 = checksumLine.trim().split(/\s+/)[0].toLowerCase()
    if (listedSha256 != expectedSha256) {
      throw new GradleException("PDFium checksum-list entry mismatch for ${assetName}: expected ${expectedSha256}, got ${listedSha256}")
    }

    def extracted = new File(downloadDir, 'extracted')
    copy {
      from zipTree(archive)
      into extracted
    }

    def extractedArchives = [
      new File(extracted, 'android/arm64-v8a-libpdfium.a'),
      new File(extracted, 'android/x86_64-libpdfium.a')
    ]
    if (!extractedArchives.every { it.isFile() }) {
      throw new GradleException("PDFium archive does not contain both Android libraries: ${archive}")
    }
    logger.lifecycle('PDFium: installing libpdfium.a')
    pdfiumAndroidArchives.eachWithIndex { destination, index ->
      destination.parentFile.mkdirs()
      copy {
        from extractedArchives[index]
        into destination.parentFile
        rename { destination.name }
      }
      def artifact = pdfiumAndroidArtifacts[destination.parentFile.name]
      if (!assertArchive(destination, artifact)) {
        throw new GradleException("Extracted PDFium archive failed validation: ${destination}")
      }
    }
    logger.lifecycle('PDFium: downloaded and verified libpdfium.a')
  }
}

def prepareInkEngine = tasks.register('prepareInkEngine') {
  inputs.file(inkEngineReleaseFile)
  outputs.files(inkEngineAndroidArchives + inkEngineAndroidMetadata + [
    new File(inkEngineAndroidRoot, 'manifest.json'),
    new File(inkEngineAndroidRoot, inkEngineRelease.checksumsAsset.toString())
  ])
  outputs.upToDateWhen { !inkEngineUseSource && isValidInkEngineInstallation() }

  doLast {
    if (inkEngineUseSource) {
      return
    }
    if (isValidInkEngineInstallation()) {
      logger.lifecycle('InkEngine: using cached libinkengine.a')
      return
    }

    def releaseBase = "${inkEngineRelease.repository}/releases/download/${inkEngineRelease.releaseTag}"
    def downloadDir = file("${buildDir}/ink-engine-download")
    delete(downloadDir)
    downloadDir.mkdirs()

    def archive = new File(downloadDir, inkEngineRelease.archive.toString())
    def checksums = new File(downloadDir, inkEngineRelease.checksumsAsset.toString())
    logger.lifecycle("InkEngine: downloading ${archive.name} and ${checksums.name}")
    downloadReleaseAsset("${releaseBase}/${inkEngineRelease.archive}", archive)
    downloadReleaseAsset("${releaseBase}/${inkEngineRelease.checksumsAsset}", checksums)

    logger.lifecycle("InkEngine: verifying ${archive.name}")
    if (archive.length() != inkEngineRelease.archiveBytes as long ||
        sha256File(archive) != inkEngineRelease.archiveSha256.toString().toLowerCase()) {
      throw new GradleException('InkEngine release archive does not match the pinned ZIP')
    }
    if (checksums.length() != inkEngineRelease.checksumsAssetBytes as long ||
        sha256File(checksums) != inkEngineRelease.checksumsAssetSha256.toString().toLowerCase()) {
      throw new GradleException('InkEngine checksum list does not match the pinned release')
    }
    if (checksumFor(checksums, inkEngineRelease.archive.toString()) !=
        inkEngineRelease.archiveSha256.toString().toLowerCase()) {
      throw new GradleException('InkEngine checksum list does not validate the release archive')
    }

    def extracted = new File(downloadDir, 'extracted')
    copy {
      from zipTree(archive)
      into extracted
    }
    copy {
      from checksums
      into extracted
    }
    logger.lifecycle('InkEngine: installing libinkengine.a')
    assertInkEngineInstallation(extracted, new File(extracted, 'android'))

    delete(inkEngineAndroidRoot)
    copy {
      from new File(extracted, 'manifest.json')
      into inkEngineAndroidRoot
    }
    copy {
      from checksums
      into inkEngineAndroidRoot
    }
    inkEngineRelease.abis.each { abi ->
      def expected = inkEngineRelease.artifacts[abi.toString()]
      def destination = new File(inkEngineAndroidRoot, abi.toString())
      copy {
        from new File(extracted, "android/${abi}/${expected.archive}")
        into destination
      }
      copy {
        from new File(extracted, "android/${abi}/${expected.metadata}")
        into destination
      }
    }
    assertInkEngineInstallation(inkEngineAndroidRoot)
    logger.lifecycle('InkEngine: downloaded and verified libinkengine.a')
  }
}

tasks.configureEach { task ->
  if (task.name.startsWith('configureCMake') ||
      task.name.startsWith('buildCMake') ||
      task.name.contains('ExternalNativeBuild')) {
    task.dependsOn(preparePdfium)
    if (!inkEngineUseSource) {
      task.dependsOn(prepareInkEngine)
    }
  }
}

def reactNativeArchitectures() {
  def value = rootProject.getProperties().get('reactNativeArchitectures')
  return value ? value.split(',') : ['arm64-v8a', 'x86_64']
}

def reactNativeReleaseArchitectures() {
  def value = rootProject.getProperties().get('reactNativeReleaseArchitectures')
  return value ? value.split(',') : ['arm64-v8a']
}

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name)
    ? rootProject.ext.get(name)
    : project.properties["ReactNativeInkSignPdf_${name}"].toInteger()
}

android {
  namespace = 'com.margelo.nitro.inksignpdf'
  ndkVersion = rootProject.ext.ndkVersion
  compileSdkVersion = getExtOrIntegerDefault('compileSdkVersion')
  compileSdkExtension = 18

  buildFeatures {
    buildConfig = true
    prefab = true
  }

  packagingOptions {
    jniLibs {
      pickFirsts += [
        '**/libc++_shared.so',
        '**/libfbjni.so',
        '**/libjsi.so',
        '**/libreactnative.so'
      ]
    }
  }

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault('minSdkVersion')
    targetSdkVersion getExtOrIntegerDefault('targetSdkVersion')
    testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    ndk {
      abiFilters(*reactNativeArchitectures())
    }
    externalNativeBuild {
      cmake {
        cppFlags '-std=c++20 -frtti -fexceptions -Wall -Wextra'
        arguments '-DANDROID_STL=c++_shared', '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON',
          "-DINK_ENGINE_USE_SOURCE=${inkEngineUseSource ? 'ON' : 'OFF'}",
          "-DINK_ENGINE_ARCHIVE_ROOT=${inkEngineAndroidRoot}",
          "-DINK_ENGINE_EXPECTED_NDK_VERSION=${inkEngineRelease.ndkVersion}"
        abiFilters(*reactNativeArchitectures())
      }
    }
  }

  buildTypes {
    release {
      ndk {
        abiFilters(*reactNativeReleaseArchitectures())
      }
    }
  }

  androidResources {
    noCompress += ['pdf']
  }

  externalNativeBuild {
    cmake { path 'CMakeLists.txt' }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = '17'
  }
}

def configuredPdfiumAndroidNdk = android.ndkVersion?.toString()
if (configuredPdfiumAndroidNdk != requiredPdfiumAndroidNdk) {
  throw new GradleException(
    "PDFium Android archives require NDK ${requiredPdfiumAndroidNdk}; " +
    "the consuming project is configured for ${configuredPdfiumAndroidNdk ?: 'unspecified'}"
  )
}
if (!inkEngineUseSource && configuredPdfiumAndroidNdk != inkEngineRelease.ndkVersion.toString()) {
  throw new GradleException(
    "InkEngine Android archives require NDK ${inkEngineRelease.ndkVersion}; " +
    "the consuming project is configured for ${configuredPdfiumAndroidNdk ?: 'unspecified'}"
  )
}

androidComponents {
  onVariants(selector().withBuildType('debug')) { variant ->
    variant.externalNativeBuild.abiFilters.set(reactNativeArchitectures() as Set)
  }
  onVariants(selector().withBuildType('release')) { variant ->
    variant.externalNativeBuild.abiFilters.set(reactNativeReleaseArchitectures() as Set)
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
  implementation project(':react-native-nitro-modules')
  implementation 'androidx.core:core-ktx:1.13.1'
  implementation 'androidx.graphics:graphics-core:1.0.4'
  implementation 'androidx.input:input-motionprediction:1.0.0'
  testImplementation 'junit:junit:4.13.2'
  androidTestImplementation 'androidx.test.ext:junit:1.2.1'
  androidTestImplementation 'androidx.test:runner:1.6.2'
  androidTestImplementation 'com.facebook.fbjni:fbjni:0.7.0'
}
